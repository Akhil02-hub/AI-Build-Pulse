name: Daily AI News Notifications

on:
  schedule:
    - cron: '30 2 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '30 5 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '30 8 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '30 11 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '30 14 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '30 17 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send Push Notification
        env:
          FIREBASE_SERVER_KEY: ${{ secrets.FIREBASE_SERVER_KEY }}
        run: node scripts/send-notification.mjs