
name: Daily AI Engineer News

on:
  schedule:
    # Every day at 12:00 AM UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:

# Prevent overlapping runs
concurrency:
  group: daily-news-main
  cancel-in-progress: false

# Required permissions
permissions:
  contents: write
  models: read

jobs:
  collect:
    name: Collect and Update Daily News
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout main branch
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      # 3. Install dependencies when required
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            echo "Installing from lockfile..."
            npm ci --no-audit --no-fund
          elif [[ -f package.json ]]; then
            echo "No lockfile found. Installing from package.json..."
            npm install --no-audit --no-fund
          else
            echo "No package.json found. Assuming zero dependencies."
          fi

      # 4. Collect news and apply retention
      - name: Collect and prune news
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/collect-news.mjs

      # 5. Commit and safely push generated data
      - name: Commit and Push
        shell: bash
        run: |
          set -Eeuo pipefail

          # Verify generated data directory
          if [[ ! -d data ]]; then
            echo "::error::The collector did not create the data directory."
            exit 1
          fi

          # Preserve the exact generated output for conflict recovery
          SNAPSHOT_DIR="${RUNNER_TEMP}/daily-news-data"
          rm -rf "$SNAPSHOT_DIR"
          mkdir -p "$SNAPSHOT_DIR"
          cp -a data/. "$SNAPSHOT_DIR/"

          # Configure Git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage additions, modifications and deletions
          git add -A -- data/

          # Avoid empty commits
          if git diff --cached --quiet; then
            echo "No changes detected. Nothing to commit."
            exit 0
          fi

          git commit -m "Update daily AI engineer news"

          # Retry if main changes during the push
          for attempt in 1 2 3 4 5; do
            echo "========== Push attempt $attempt/5 =========="

            # Fetch the latest main branch
            git fetch --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main

            # Rebase generated commit onto latest main
            if ! git rebase origin/main; then
              echo "Rebase conflict detected."
              echo "Restoring generated data on latest main..."

              # Abort incomplete rebase
              git rebase --abort 2>/dev/null || true

              # Reset to latest remote branch
              git reset --hard origin/main

              # Restore exact generated data, including deletions
              rm -rf data
              mkdir -p data
              cp -a "$SNAPSHOT_DIR/." data/

              git add -A -- data/

              # Check whether remote already contains our changes
              if git diff --cached --quiet; then
                echo "No new changes remain. Exiting successfully."
                exit 0
              fi

              git commit -m "Update daily AI engineer news"
            fi

            # Push without force
            if git push origin HEAD:refs/heads/main; then
              echo "Successfully pushed daily news."
              exit 0
            fi

            echo "Push rejected. Fetching latest changes before retry..."
            sleep 5
          done

          echo "::error::Push failed after 5 attempts."
          exit 1
