name: Daily AI Engineer News

on:
  schedule:
    # Run every midnight at 12:00 AM (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

# Prevent overlapping runs from clashing
concurrency:
  group: daily-news-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so we can rebase
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Collect + prune feed (24h fetch · 7-day retention)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node scripts/collect-news.mjs

      - name: Commit and Push
        run: |
          set -e

          git config user.name "akhil02-hub"
          git config user.email "amarachinthaakhil@gmail.com"

          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit — exiting cleanly."
            exit 0
          fi

          git commit -m "Update daily news (retention: 7 days)"
          OUR_COMMIT=$(git rev-parse HEAD)
          echo "Our commit: $OUR_COMMIT"

          for attempt in 1 2 3 4 5; do
            echo "──────── Push attempt $attempt ────────"
            git fetch origin main

            # If remote advanced, rebase onto it
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "Remote has new commits — rebasing..."
              if ! git rebase origin/main; then
                echo "⚠️  Rebase conflict — resolving by keeping our fresh data"
                git rebase --abort 2>/dev/null || true

                # Reset to remote, then re-apply our data on top
                git reset --hard origin/main
                git checkout "$OUR_COMMIT" -- data/
                git add data/
                git commit -m "Update daily news (retention: 7 days)"
                OUR_COMMIT=$(git rev-parse HEAD)
                echo "New commit after conflict resolution: $OUR_COMMIT"
              fi
            fi

            if git push origin HEAD:main; then
              echo "✅ Push succeeded on attempt $attempt"
              exit 0
            fi

            echo "⏳ Push rejected — retrying in 5s..."
            sleep 5
          done

          echo "❌ Failed to push after 5 attempts"
          exit 1